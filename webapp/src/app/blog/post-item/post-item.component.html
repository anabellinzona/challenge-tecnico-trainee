<div class="post">
  <h3 (click)="toggle()">{{ post.title }}</h3>

  <div *ngIf="expanded">
    <p>{{ post.content }}</p>

    <!-- Categories -->
    <span
      class="tag"
      *ngFor="let cat of post.categories">
      {{ cat.name }}
    </span>

    <!-- Actions -->
    <button (click)="startEdit()">Edit</button>
    <button (click)="deletePost()">Delete</button>

    <!-- Edit -->
    <div *ngIf="editing">
      <input [(ngModel)]="editedPost.title" />
      <textarea [(ngModel)]="editedPost.content"></textarea>

      <button (click)="saveEdit()">Save</button>
      <button (click)="cancelEdit()">Cancel</button>
    </div>

    <!-- Comments (próximo paso) -->
    <!-- <app-comment-list [postId]="post.id"></app-comment-list> -->
  </div>
</div>
