<div class="blog-detail">
  <div class="header-actions">
    <a routerLink="/posts" class="btn">Back to List</a>
  </div>

  <h2>Create New Post</h2>

  <form (ngSubmit)="savePost()">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" [(ngModel)]="post.title" name="title" required class="form-control">
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" [(ngModel)]="post.content" name="content" rows="10" required
        class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label>Categories</label>

      <div class="checkbox-group">
        <div *ngFor="let category of categories" class="form-check">
          <input type="checkbox" class="form-check-input" [id]="'cat-' + category.id"
            (change)="onCategoryChange($event, category.id)" />

          <label class="form-check-label" [for]="'cat-' + category.id">
            {{ category.name }}
          </label>
        </div>
      </div>
    </div>



    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create</button>
      <button type="button" (click)="cancel()" class="btn">Cancel</button>
    </div>
  </form>
</div>
